name: Refresh GigaChat Token
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Get and push token
        run: |
          TOKEN=$(curl -s -k -L -X POST 'https://ngw.devices.sberbank.ru:9443/api/v2/oauth' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H 'Accept: application/json' \
            -H 'RqUID: 3107d4f7-dd40-41b1-82d2-4f04e7b96365' \
            -H 'Authorization: Basic MDE5ZWI3NTUtZDY0OC03YmUwLWFmNjQtYzFkZjU4MzQ1MDNhOjhkN2EwM2UyLWI2OWUtNDU0OC04YjdjLTY0NDdiNjg3YzY2Nw==' \
            --data-urlencode 'scope=GIGACHAT_API_PERS' | jq -r '.access_token')
          curl -s -X POST 'http://intelline.ru/update-token.php' \
            --data-urlencode "secret=intelline-token-2026" --data-urlencode "token=$TOKEN"
